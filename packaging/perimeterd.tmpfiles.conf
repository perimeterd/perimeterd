# Type Path Mode User Group Age
# The service and its lifecycle lock retain stable inodes across restarts.
d /etc/perimeterd 0700 root root -
d /etc/perimeterd/credentials.d 0700 root root -
d /var/lib/perimeterd 0700 root root -
d /run/perimeterd 0700 root root -
f /run/perimeterd/owner.lock 0600 root root -
# Shared by every iptables/ip6tables process; create only when absent.
f /run/xtables.lock 0600 root root -
