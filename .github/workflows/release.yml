name: Release

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

# Every main commit gets its own prerelease; tags never cancel one another.
concurrency:
  group: release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate main ancestry, SemVer and stable tag signature
        id: release
        env:
          RELEASE_SIGNING_PUBLIC_KEYS: ${{ vars.RELEASE_SIGNING_PUBLIC_KEYS }}
        run: python3 scripts/release-metadata.py

  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  codeql:
    needs: metadata
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  packages:
    needs: metadata
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
      artifact-name: release-dist

  publish:
    needs: [metadata, checks, codeql, packages]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-dist
          path: dist
      - name: Verify and select the tested release assets
        run: python3 scripts/release-assets.py dist release-assets
      - name: Sign provenance for every release asset
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/*
      - name: Publish tested artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$BUNDLE" release-assets/provenance.sigstore.json
          args=(--target "$COMMIT" --title "$VERSION" --generate-notes --draft)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--verify-tag --latest)
          fi
          gh release create "$VERSION" "${args[@]}" release-assets/*
          # An upload failure leaves a draft, never a partially published release.
          gh release edit "$VERSION" --draft=false
