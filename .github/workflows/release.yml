name: Release

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

# Every main commit gets its own prerelease; tags never cancel one another.
concurrency:
  group: release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select or recover and re-admit the release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_PUBLIC_KEYS: ${{ vars.RELEASE_SIGNING_PUBLIC_KEYS }}
        run: python3 scripts/release-metadata.py --prepare "$RUNNER_TEMP/release-metadata.json"
      - name: Persist release identity for this run
        if: github.run_attempt == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/release-metadata.json
          if-no-files-found: error
          retention-days: 90
      - name: Expose only the durable release identity
        id: release
        run: python3 scripts/release-metadata.py --emit "$RUNNER_TEMP/release-metadata.json"

  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  codeql:
    needs: metadata
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  packages:
    needs: metadata
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
      artifact-name: release-dist

  publish:
    needs: [metadata, checks, codeql, packages]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.packages.outputs.candidate-artifact-name }}
          path: dist
      - name: Verify and select the tested release assets
        run: python3 scripts/release-assets.py dist release-assets
      - name: Sign provenance for every release asset
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/*
      - name: Recover or publish the immutable tested release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          cp -- "$BUNDLE" release-assets/provenance.sigstore.json
          python3 scripts/release-publish.py release-assets
