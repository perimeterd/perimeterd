name: Systemd VM

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: release-dist
        required: false

permissions:
  contents: read

jobs:
  systemd-vm:
    name: Installed service in disposable Ubuntu VM
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download staged package artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.artifact-name }}
          path: dist
      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cloud-image-utils qemu-system-x86 qemu-utils openssh-client curl python3
      - name: Run installed-package systemd acceptance (fast)
        env:
          SYSTEMD_VM_OUTPUT_DIR: ${{ runner.temp }}/perimeterd-systemd
        run: tests/systemd/run.sh --fast dist
      - name: Upload VM diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: systemd-vm-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/perimeterd-systemd
          if-no-files-found: warn
