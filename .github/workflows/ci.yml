name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.workflow == 'Release' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

env:
  VERSION: ci
  COMMIT: ${{ github.sha }}

jobs:
  supporting-files:
    name: supporting-file gate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go for pinned supporting tools
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Check scripts, workflows, release config and regressions
        run: make support-check

  verify:
    name: verify (amd64)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Set build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Run module, format, lint, vulnerability, build, and unit gates
        run: make verify
      - name: Run race tests
        run: make test-race
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-amd64
          path: coverage.out
          if-no-files-found: error

  build:
    name: build (${{ matrix.goarch }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
    env:
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Set build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build Linux binary
        run: make build

  e2e:
    name: privileged firewall E2E
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install namespace test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes nftables iproute2 iptables ipset
          sudo modprobe ip_set_hash_net
          sudo modprobe ip_set_hash_ip
          sudo modprobe xt_set
          sudo modprobe iptable_filter
          sudo modprobe ip6table_filter
      - name: Run isolated kernel E2E
        run: E2E_SUDO=sudo make test-e2e

  crowdsec:
    name: real CrowdSec LAPI compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Run pinned real-LAPI gate
        run: make test-crowdsec

  openziti:
    name: real OpenZiti list and LAPI transports
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      ZITI_VERSION: "2.0.4"
      ZITI_SHA256: 87b8410888c40cc040fd4cbe3262f489c0b36c40b0b07eca879c5199c58826a9
      CROWDSEC_VERSION: "1.8.1"
      CROWDSEC_SHA256: ae64cdab8ee49534d6c36eab4ce40b5478842a4b4abfe83f7796aace569821eb
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install native firewall tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nftables iproute2 iptables ipset
          sudo modprobe ip_set_hash_net
          sudo modprobe ip_set_hash_ip
          sudo modprobe xt_set
          sudo modprobe iptable_filter
          sudo modprobe ip6table_filter
      - name: Install checksum-verified OpenZiti and CrowdSec fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/openziti" "$RUNNER_TEMP/crowdsec" "$RUNNER_TEMP/crowdsec-bin"
          curl --fail --location --retry 3 "https://github.com/openziti/ziti/releases/download/v${ZITI_VERSION}/ziti-linux-amd64-${ZITI_VERSION}.tar.gz" --output "$RUNNER_TEMP/ziti.tgz"
          printf '%s  %s\n' "$ZITI_SHA256" "$RUNNER_TEMP/ziti.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/ziti.tgz" -C "$RUNNER_TEMP/openziti"
          curl --fail --location --retry 3 "https://github.com/crowdsecurity/crowdsec/releases/download/v${CROWDSEC_VERSION}/crowdsec-release.tgz" --output "$RUNNER_TEMP/crowdsec.tgz"
          printf '%s  %s\n' "$CROWDSEC_SHA256" "$RUNNER_TEMP/crowdsec.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/crowdsec.tgz" -C "$RUNNER_TEMP/crowdsec"
          ln -s "$RUNNER_TEMP/crowdsec/crowdsec-v${CROWDSEC_VERSION}/cmd/crowdsec/crowdsec" "$RUNNER_TEMP/crowdsec-bin/crowdsec"
          ln -s "$RUNNER_TEMP/crowdsec/crowdsec-v${CROWDSEC_VERSION}/cmd/crowdsec-cli/cscli" "$RUNNER_TEMP/crowdsec-bin/cscli"
      - name: Run real private-service acceptance gate
        run: E2E_SUDO=sudo ZITI_TEST_BINARY="$RUNNER_TEMP/openziti/ziti" CROWDSEC_TEST_BINDIR="$RUNNER_TEMP/crowdsec-bin" make test-openziti

  docker:
    name: isolated Docker coexistence
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DOCKER_VERSION: "29.8.1"
      DOCKER_SHA256: d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes nftables iproute2 iptables ipset
          sudo modprobe ip_set_hash_net
          sudo modprobe xt_set
          sudo modprobe iptable_filter
          sudo modprobe ip6table_filter
      - name: Prepare pinned Docker Engine toolset
        run: |
          mkdir -p "$RUNNER_TEMP/docker-engine"
          curl --fail --location --retry 3 \
            "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz" \
            --output "$RUNNER_TEMP/docker-engine.tgz"
          printf '%s  %s\n' "$DOCKER_SHA256" "$RUNNER_TEMP/docker-engine.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/docker-engine.tgz" -C "$RUNNER_TEMP/docker-engine"
      - name: Run real isolated Docker packet-path gate
        run: E2E_SUDO=sudo DOCKER_TEST_BINDIR="$RUNNER_TEMP/docker-engine/docker" make test-docker

  packages:
    if: github.workflow == 'CI'
    uses: ./.github/workflows/packages.yml
